name: Jenkins en runner Linux

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      capturas:
        description: Guardar capturas del build, las etapas y las pruebas JUnit
        type: boolean
        default: false
      sin_cache:
        description: Reconstruir las dos imágenes desde un checkout limpio y sin caché de capas
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jenkins-alojado-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ejecutar-jenkins:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar captura opcional
        if: github.event_name == 'push' || inputs.capturas
        run: |
          herramientas="$RUNNER_TEMP/ruta-ci-capturas"
          mkdir -p "$herramientas"
          cp jenkins/capturas/package.json jenkins/capturas/package-lock.json "$herramientas/"
          (cd "$herramientas" && npm ci --ignore-scripts --no-audit --no-fund)
          chrome="$(command -v google-chrome)"
          printf 'RUTA_CI_CHROME=%s\n' "$chrome" >> "$GITHUB_ENV"
      - name: Ejecutar el Jenkinsfile del proyecto
        id: ejecutar
        env:
          RUTA_CI_GITHUB_LECTURA: ${{ github.token }}
          RUTA_CI_ANTES_PUSH: ${{ github.event.before }}
          PYTHONPATH: guiones/ci
          RUTA_CI_CAPTURAS: ${{ github.event_name == 'push' || inputs.capturas }}
          RUTA_CI_ALOJADO_SIN_CACHE: ${{ inputs.sin_cache }}
        run: bash jenkins/ejecutar_alojado.sh
      - name: Conservar evidencia de Jenkins
        id: evidencia
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jenkins-${{ github.sha }}-${{ github.run_attempt }}
          path: salidas/jenkins-alojado/
          if-no-files-found: ${{ steps.ejecutar.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 30
      - name: Conservar capturas de Jenkins
        if: (github.event_name == 'push' || inputs.capturas) && steps.ejecutar.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jenkins-capturas-${{ github.sha }}-${{ github.run_attempt }}
          path: salidas/jenkins-capturas/
          if-no-files-found: error
          retention-days: 30
      - name: Identificar el anexo publicado
        if: ${{ always() && steps.evidencia.outputs.artifact-id != '' }}
        env:
          ANEXO_URL: ${{ steps.evidencia.outputs.artifact-url }}
          ANEXO_HUELLA: ${{ steps.evidencia.outputs.artifact-digest }}
        run: |
          huella="${ANEXO_HUELLA#sha256:}"
          [[ "$huella" =~ ^[0-9a-f]{64}$ ]]
          {
            printf '### Evidencia de Jenkins\n\n'
            printf -- '- Revisión: `%s`\n' "$GITHUB_SHA"
            printf -- '- Descargar: [artefacto de Jenkins](%s)\n' "$ANEXO_URL"
            printf -- '- SHA-256 del ZIP: `%s`\n' "$huella"
          } >> "$GITHUB_STEP_SUMMARY"
