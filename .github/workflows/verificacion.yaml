name: Verificación Windows y Docker
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: windows-2025
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.403'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.5.2'
      - name: Restaurar versiones bloqueadas
        shell: pwsh
        run: dotnet restore RutaEstadistica.sln --locked-mode
      - name: Verificar fuentes y digests del contenedor
        shell: pwsh
        run: ./guiones/verificar_fuentes_contenedor.ps1
      - name: Preparar motor nativo
        shell: pwsh
        run: |
          $rutaR = (Rscript --vanilla -e 'cat(R.home())').Trim()
          if ($LASTEXITCODE -ne 0 -or -not $rutaR) { throw 'No se pudo determinar la instalación de R' }
          "RUTA_ESTADISTICA_R_CI=$rutaR" >> $env:GITHUB_ENV
          ./guiones/preparar_desarrollo.ps1 -RutaR $rutaR -AdquirirJson
      - name: Verificar cifras, integración, documentación y nombres
        shell: pwsh
        run: ./guiones/ejecutar_pruebas.ps1 -RutaR $env:RUTA_ESTADISTICA_R_CI
      - name: Compilar escritorio
        shell: pwsh
        run: ./guiones/compilar.ps1
      - name: Compilar API de trabajos
        shell: pwsh
        run: dotnet build codigo/RutaEstadistica.ServidorLocal -c Release --no-restore
      - name: Verificar API y adaptador con R real en Windows
        shell: pwsh
        run: python guiones/probar_api.py
      - name: Compilar host MCP
        shell: pwsh
        run: dotnet build codigo/RutaEstadistica.ServidorMcp -c Release --no-restore

  docker:
    name: Docker Linux y cálculo entre contenedores
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preparar secreto temporal y carpeta de evidencias
        run: |
          directorio="$(mktemp -d "$RUNNER_TEMP/ruta-estadistica.XXXXXXXX")"
          secreto="$directorio/motor.secreto"
          openssl rand -hex 32 > "$secreto"
          chmod 0444 "$secreto"
          echo "RUTA_ESTADISTICA_ARCHIVO_SECRETO=$secreto" >> "$GITHUB_ENV"
          echo "RUTA_ESTADISTICA_EVIDENCIAS=$directorio/evidencias" >> "$GITHUB_ENV"
          mkdir "$directorio/evidencias"
      - name: Compilar las dos imágenes
        run: docker compose --progress plain build 2>&1 | tee "$RUTA_ESTADISTICA_EVIDENCIAS/01-compilacion.txt"
      - name: Arrancar Compose y esperar la salud de los servicios
        run: docker compose up -d --wait --wait-timeout 90 2>&1 | tee "$RUTA_ESTADISTICA_EVIDENCIAS/02-arranque.txt"
      - name: Registrar el estado y la red
        run: |
          docker ps --filter label=com.docker.compose.project=ruta-estadistica-demo | tee "$RUTA_ESTADISTICA_EVIDENCIAS/03-docker-ps.txt"
          docker network inspect ruta-estadistica-demo_analisis --format '{{.Name}} ({{.Driver}}){{range .Containers}}{{println}}{{.Name}} {{.IPv4Address}}{{end}}' | tee "$RUTA_ESTADISTICA_EVIDENCIAS/04-red.txt"
      - name: Ejecutar el cálculo desde la aplicación
        run: docker compose exec -T aplicacion python probar_compose.py | tee "$RUTA_ESTADISTICA_EVIDENCIAS/05-calculo.txt"
      - name: Verificar que el secreto se inyecta solo en ejecución
        run: |
          for imagen in $(docker compose images -q | sort -u); do
            docker run --rm --entrypoint /bin/sh "$imagen" -ec 'test ! -e /run/secrets/motor'
          done
          docker compose logs --no-color > "$RUNNER_TEMP/ruta-estadistica-servicios.log"
          if grep -rFq -f "$RUTA_ESTADISTICA_ARCHIVO_SECRETO" "$RUTA_ESTADISTICA_EVIDENCIAS" "$RUNNER_TEMP/ruta-estadistica-servicios.log"; then
            echo "::error::Se detectó la credencial en los registros"
            exit 1
          fi
      - name: Publicar evidencias del cálculo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-linux-${{ github.sha }}
          path: ${{ env.RUTA_ESTADISTICA_EVIDENCIAS }}
          if-no-files-found: error
      - name: Apagar servicios y retirar el secreto
        if: always()
        run: |
          if [ -n "$RUTA_ESTADISTICA_ARCHIVO_SECRETO" ]; then
            trap 'rm -f "$RUTA_ESTADISTICA_ARCHIVO_SECRETO"' EXIT
            docker compose down --remove-orphans
          fi
