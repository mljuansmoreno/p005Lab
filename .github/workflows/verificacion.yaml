name: Verificación Windows y Docker
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verificar:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.403'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.5.2'
      - name: Restaurar versiones bloqueadas
        shell: pwsh
        run: dotnet restore RutaEstadistica.sln --locked-mode
      - name: Verificar fuentes y digests del contenedor
        shell: pwsh
        run: ./guiones/verificar_fuentes_contenedor.ps1
      - name: Preparar motor nativo
        shell: pwsh
        run: |
          $rutaR = (Rscript --vanilla -e 'cat(R.home())').Trim()
          if ($LASTEXITCODE -ne 0 -or -not $rutaR) { throw 'No se pudo determinar la instalación de R' }
          "RUTA_ESTADISTICA_R_CI=$rutaR" >> $env:GITHUB_ENV
          ./guiones/preparar_desarrollo.ps1 -RutaR $rutaR -AdquirirJson
      - name: Verificar cifras, integración, documentación y nombres
        shell: pwsh
        run: ./guiones/ejecutar_pruebas.ps1 -RutaR $env:RUTA_ESTADISTICA_R_CI
      - name: Compilar escritorio
        shell: pwsh
        run: ./guiones/compilar.ps1
      - name: Compilar API de trabajos
        shell: pwsh
        run: dotnet build codigo/RutaEstadistica.ServidorLocal -c Release --no-restore
      - name: Verificar API y adaptador con R real en Windows
        shell: pwsh
        run: python guiones/probar_api.py
      - name: Compilar host MCP
        shell: pwsh
        run: dotnet build codigo/RutaEstadistica.ServidorMcp -c Release --no-restore

  docker:
    name: Docker Linux y cálculo entre contenedores
    runs-on: ubuntu-24.04
    env:
      RUTA_ESTADISTICA_REVISION: ${{ github.sha }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Probar el contrato web sin Docker
        env:
          PYTHONPATH: aplicacion:guiones
        run: python3 -m unittest discover -s pruebas -p test_aplicacion_web.py
      - name: Preparar secreto temporal y carpeta de evidencias
        run: |
          cp .env.example .env
          git check-ignore --quiet .env
          git check-ignore --quiet credenciales/motor.secreto
          secreto="$(docker compose config --format json | jq -er '.secrets.motor.file')"
          echo "RUTA_ESTADISTICA_ARCHIVO_SECRETO=$secreto" >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$(dirname "$secreto")"
          openssl rand -hex 32 > "$secreto"
          chmod 0444 "$secreto"
          echo "::add-mask::$(cat "$secreto")"
          evidencias="$(mktemp -d "$RUNNER_TEMP/ruta-estadistica.XXXXXXXX")"
          echo "RUTA_ESTADISTICA_EVIDENCIAS=$evidencias" >> "$GITHUB_ENV"
      - name: Validar la configuración resuelta de Compose
        run: |
          docker compose config --format json | jq -e '
            (.services | keys) == ["aplicacion", "motor"] and
            .networks.analisis.internal and
            (.services.motor.networks | keys) == ["analisis"] and
            (.services.motor.ports | length) == 0 and
            (.services.aplicacion.ports | length) == 1 and
            .services.aplicacion.ports[0].host_ip == "127.0.0.1"
          '
      - name: Compilar las dos imágenes
        run: docker compose --progress plain build 2>&1 | tee "$RUTA_ESTADISTICA_EVIDENCIAS/01-compilacion.txt"
      - name: Arrancar Compose y esperar la salud de los servicios
        run: docker compose up -d --wait --wait-timeout 90 2>&1 | tee "$RUTA_ESTADISTICA_EVIDENCIAS/02-arranque.txt"
      - name: Registrar el estado y la red
        run: |
          docker ps --filter label=com.docker.compose.project=ruta-estadistica-demo | tee "$RUTA_ESTADISTICA_EVIDENCIAS/03-docker-ps.txt"
          aplicacion="$(docker compose ps --format '{{.Name}}' aplicacion)"
          motor="$(docker compose ps --format '{{.Name}}' motor)"
          docker network inspect ruta-estadistica-demo_analisis |
            jq -er --arg aplicacion "$aplicacion" --arg motor "$motor" '
              .[0] | select(.Driver == "bridge" and .Internal and
                ([.Containers[].Name] | sort) == ([$aplicacion, $motor] | sort)) |
              "\(.Name) (\(.Driver))", (.Containers[] | "\(.Name) \(.IPv4Address)")
            ' | tee "$RUTA_ESTADISTICA_EVIDENCIAS/04-red.txt"
          docker inspect "$motor" --format '{{json .HostConfig.PortBindings}}' | jq -e 'length == 0'
      - name: Verificar el aislamiento de los contenedores
        run: |
          docker inspect "$(docker compose ps -q aplicacion)" "$(docker compose ps -q motor)" |
            jq -e 'length == 2 and all(.[];
              .Config.User == "1654:1654" and
              .HostConfig.ReadonlyRootfs and
              (.HostConfig.CapDrop | map(ascii_downcase) | index("all")) != null and
              (.HostConfig.SecurityOpt | any(startswith("no-new-privileges"))) and
              .HostConfig.Memory > 0 and .HostConfig.PidsLimit > 0 and
              .HostConfig.LogConfig.Type == "local"
            )'
      - name: Comprobar el acceso web desde el host
        run: |
          pagina="$RUNNER_TEMP/ruta-estadistica-web.html"
          curl --noproxy '*' --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/ --output "$pagina"
          grep -Fq 'action="/analizar"' "$pagina"
      - name: Comprobar la autenticación interna del motor
        run: |
          curl --noproxy '*' --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/listo |
            jq -e '.listo == true'
          docker compose exec -T aplicacion python - <<'PY'
          from http.client import HTTPConnection
          cliente = HTTPConnection("motor", 8787, timeout=5)
          cliente.request("GET", "/salud")
          respuesta = cliente.getresponse()
          if respuesta.status != 403:
              raise SystemExit(f"Se esperaba HTTP 403 sin credencial; respuesta: {respuesta.status}")
          print("Motor: HTTP 403 sin credencial; sonda autenticada correcta.")
          PY
      - name: Ejecutar el cálculo desde la aplicación
        run: docker compose exec -T aplicacion python probar_compose.py | tee "$RUTA_ESTADISTICA_EVIDENCIAS/05-calculo.txt"
      - name: Probar caída y recuperación del motor
        run: |
          web='http://127.0.0.1:8080'
          {
            anterior="$(docker compose ps -q motor)"
            docker compose stop motor
            curl --noproxy '*' --fail --silent --show-error --max-time 5 "$web/salud" | jq -e '.estado == "activo"'
            codigo="$(curl --noproxy '*' --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' "$web/listo")"
            test "$codigo" = 503
            echo "Disponibilidad con motor detenido: HTTP $codigo"
            docker compose up -d --no-deps --force-recreate --wait --wait-timeout 90 motor
            nuevo="$(docker compose ps -q motor)"
            test -n "$nuevo"
            test "$anterior" != "$nuevo"
            curl --noproxy '*' --fail --silent --show-error --max-time 5 "$web/listo" | jq -e '.listo == true'
            docker compose exec -T aplicacion python probar_compose.py
          } 2>&1 | tee "$RUTA_ESTADISTICA_EVIDENCIAS/06-recuperacion.txt"
      - name: Registrar la procedencia de la ejecución
        run: |
          docker version --format '{{json .Server}}' > "$RUNNER_TEMP/docker-servidor.json"
          docker compose version --short > "$RUNNER_TEMP/compose-version.txt"
          docker compose images --format json > "$RUNNER_TEMP/compose-imagenes.json"
          jq -n --arg revision "$RUTA_ESTADISTICA_REVISION" \
            --slurpfile docker "$RUNNER_TEMP/docker-servidor.json" \
            --rawfile compose "$RUNNER_TEMP/compose-version.txt" \
            --slurpfile imagenes "$RUNNER_TEMP/compose-imagenes.json" '
              {revision: $revision, docker: $docker[0].Version,
               compose: ($compose | rtrimstr("\n")), imagenes: $imagenes[0]}
            ' > "$RUTA_ESTADISTICA_EVIDENCIAS/00-entorno.json"
      - name: Verificar que el secreto se inyecta solo en ejecución
        run: |
          for servicio in aplicacion motor; do
            imagen="$(docker compose images -q "$servicio")"
            docker run --rm --entrypoint /bin/sh "$imagen" -ec 'test ! -e /run/secrets/motor'
          done
          registro="$RUNNER_TEMP/ruta-estadistica-servicios.log"
          docker compose logs --no-color > "$registro" 2>&1
          coincidencia=0
          grep -rFq -f "$RUTA_ESTADISTICA_ARCHIVO_SECRETO" "$RUTA_ESTADISTICA_EVIDENCIAS" "$registro" || coincidencia=$?
          if [ "$coincidencia" -eq 0 ]; then
            echo "::error::Se detectó la credencial en los registros"
            exit 1
          fi
          test "$coincidencia" -eq 1
      - name: Publicar evidencias del cálculo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-linux-${{ github.sha }}
          path: ${{ env.RUTA_ESTADISTICA_EVIDENCIAS }}
          if-no-files-found: error
          overwrite: true
      - name: Resumir la entrega Docker
        run: |
          {
            echo '### Demostración Docker'
            echo
            echo '- Imágenes construidas y dos servicios saludables.'
            echo '- Red interna, motor autenticado y controles de aislamiento verificados.'
            echo '- Análisis real en R antes y después de recrear el motor.'
            printf '\nArtefacto: `docker-linux-%s`\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mostrar el estado de Compose ante un fallo
        if: failure() && env.RUTA_ESTADISTICA_ARCHIVO_SECRETO != ''
        run: docker compose ps --all
      - name: Apagar servicios y retirar el secreto
        if: always()
        run: |
          if [ -n "$RUTA_ESTADISTICA_ARCHIVO_SECRETO" ]; then
            trap 'rm -f "$RUTA_ESTADISTICA_ARCHIVO_SECRETO"' EXIT
            docker compose down --remove-orphans
          fi
