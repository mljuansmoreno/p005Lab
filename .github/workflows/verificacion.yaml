name: Verificación Windows y Docker
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: windows-2025
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.403'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.5.2'
      - name: Restaurar versiones bloqueadas
        shell: pwsh
        run: dotnet restore RutaEstadistica.sln --locked-mode
      - name: Verificar fuentes y digests del contenedor
        shell: pwsh
        run: ./guiones/verificar_fuentes_contenedor.ps1
      - name: Preparar motor nativo
        shell: pwsh
        run: |
          $rutaR = (Rscript --vanilla -e 'cat(R.home())').Trim()
          if ($LASTEXITCODE -ne 0 -or -not $rutaR) { throw 'No se pudo determinar la instalación de R' }
          "RUTA_ESTADISTICA_R_CI=$rutaR" >> $env:GITHUB_ENV
          ./guiones/preparar_desarrollo.ps1 -RutaR $rutaR -AdquirirJson
      - name: Verificar cifras, integración, documentación y nombres
        shell: pwsh
        run: ./guiones/ejecutar_pruebas.ps1 -RutaR $env:RUTA_ESTADISTICA_R_CI
      - name: Compilar escritorio
        shell: pwsh
        run: ./guiones/compilar.ps1
      - name: Compilar API de trabajos
        shell: pwsh
        run: dotnet build codigo/RutaEstadistica.ServidorLocal -c Release --no-restore
      - name: Verificar API y adaptador con R real en Windows
        shell: pwsh
        run: python guiones/probar_api.py
      - name: Compilar host MCP
        shell: pwsh
        run: dotnet build codigo/RutaEstadistica.ServidorMcp -c Release --no-restore

  docker:
    name: Docker Linux y cálculo entre contenedores
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preparar secreto temporal y carpeta de evidencias
        run: |
          cp .env.example .env
          git check-ignore --quiet .env
          git check-ignore --quiet credenciales/motor.secreto
          secreto="$(docker compose config --format json | jq -er '.secrets.motor.file')"
          echo "RUTA_ESTADISTICA_ARCHIVO_SECRETO=$secreto" >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$(dirname "$secreto")"
          openssl rand -hex 32 > "$secreto"
          chmod 0444 "$secreto"
          echo "::add-mask::$(cat "$secreto")"
          evidencias="$(mktemp -d "$RUNNER_TEMP/ruta-estadistica.XXXXXXXX")"
          echo "RUTA_ESTADISTICA_EVIDENCIAS=$evidencias" >> "$GITHUB_ENV"
      - name: Compilar las dos imágenes
        run: docker compose --progress plain build
      - name: Arrancar Compose y esperar la salud de los servicios
        run: docker compose up -d --wait --wait-timeout 90
      - name: Registrar el estado y la red
        run: |
          docker ps --filter label=com.docker.compose.project=ruta-estadistica-demo
          aplicacion="$(docker compose ps --format '{{.Name}}' aplicacion)"
          motor="$(docker compose ps --format '{{.Name}}' motor)"
          docker network inspect ruta-estadistica-demo_analisis |
            jq -er --arg aplicacion "$aplicacion" --arg motor "$motor" '
              .[0] | select(.Driver == "bridge" and
                ([.Containers[].Name] | sort) == ([$aplicacion, $motor] | sort)) |
              "\(.Name) (\(.Driver))", (.Containers[] | "\(.Name) \(.IPv4Address)")
            '
          docker inspect "$motor" --format '{{json .HostConfig.PortBindings}}' | jq -e 'length == 0'
      - name: Ejecutar el cálculo desde la aplicación
        run: docker compose exec -T aplicacion python probar_compose.py
      - name: Apagar servicios y retirar el secreto
        if: always()
        run: |
          if [ -n "$RUTA_ESTADISTICA_ARCHIVO_SECRETO" ]; then
            trap 'rm -f "$RUTA_ESTADISTICA_ARCHIVO_SECRETO"' EXIT
            docker compose down --remove-orphans
          fi
