name: Verificación Windows y Docker
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  secretos:
    name: Credenciales y archivos comprimidos
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verificar inventario QA antes de las suites
        run: python3 guiones/ci/probar_python.py --suite rapida
      - name: Ejecutar suites Python de coordinación, web y resiliencia
        env:
          RUTA_QA_REPORTES: salidas/qa/reportes
        run: python3 guiones/ci/probar_python.py
      - name: Revisar el contenido publicable
        run: bash guiones/verificar_secretos.sh

  verificar:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.403'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.5.2'
      - name: Restaurar versiones bloqueadas
        shell: pwsh
        run: dotnet restore RutaEstadistica.sln --locked-mode
      - name: Verificar fuentes y digests del contenedor
        shell: pwsh
        run: ./guiones/verificar_fuentes_contenedor.ps1
      - name: Preparar motor nativo
        shell: pwsh
        run: |
          $rutaR = (Rscript --vanilla -e 'cat(R.home())').Trim()
          if ($LASTEXITCODE -ne 0 -or -not $rutaR) { throw 'No se pudo determinar la instalación de R' }
          "RUTA_ESTADISTICA_R_CI=$rutaR" >> $env:GITHUB_ENV
          ./guiones/preparar_desarrollo.ps1 -RutaR $rutaR -AdquirirJson
      - name: Verificar cifras, integración, documentación y nombres
        shell: pwsh
        run: ./guiones/ejecutar_pruebas.ps1 -RutaR $env:RUTA_ESTADISTICA_R_CI
      - name: Verificar permutaciones con el paquete R nativo
        shell: pwsh
        run: |
          $env:R_LIBS_USER = (Resolve-Path .dependencias/R/biblioteca).Path
          Rscript --vanilla pruebas/numericas/verificar_permutaciones.R
      - name: Compilar escritorio
        shell: pwsh
        run: ./guiones/compilar.ps1
      - name: Compilar API de trabajos
        shell: pwsh
        run: dotnet build codigo/RutaEstadistica.ServidorLocal -c Release --no-restore
      - name: Verificar API y adaptador con R real en Windows
        shell: pwsh
        run: python guiones/probar_api.py
      - name: Verificar contratos del servidor .NET por HTTP
        run: python guiones/ci/probar_junit.py pruebas/api salidas/qa/reportes/api.xml
      - name: Compilar host MCP
        shell: pwsh
        run: dotnet build codigo/RutaEstadistica.ServidorMcp -c Release --no-restore

  docker:
    name: Docker Linux y cálculo entre contenedores
    runs-on: ubuntu-24.04
    env:
      RUTA_ESTADISTICA_REVISION: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: ruta-actions-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_DISABLE_ENV_FILE: '1'
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cotejar bases y fuentes fijadas
        run: python3 guiones/ci/verificar_fuentes.py
      - name: Preparar secreto temporal y carpeta de evidencias
        run: |
          umask 077
          privado="$(mktemp -d "$RUNNER_TEMP/ruta-secreto.XXXXXXXX")"
          secreto="$privado/motor.secreto"
          trap 'rm -f -- "$secreto"; rmdir -- "$privado"' EXIT
          openssl rand -hex 32 > "$secreto"
          chmod 0444 "$secreto"
          printf '::add-mask::%s\n' "$(< "$secreto")"
          evidencias="$(mktemp -d "$RUNNER_TEMP/ruta-estadistica.XXXXXXXX")"
          {
            printf 'RUTA_ESTADISTICA_ARCHIVO_SECRETO=%s\n' "$secreto"
            printf 'RUTA_ESTADISTICA_EVIDENCIAS=%s\n' "$evidencias"
          } >> "$GITHUB_ENV"
          trap - EXIT
      - name: Validar la configuración resuelta de Compose
        run: bash guiones/ci/comprobar_compose.sh configuracion
      - name: Compilar las dos imágenes
        run: docker compose --progress plain build 2>&1 | tee "$RUTA_ESTADISTICA_EVIDENCIAS/01-compilacion.txt"
      - name: Arrancar Compose y esperar la salud de los servicios
        run: docker compose up -d --wait --wait-timeout 90 2>&1 | tee "$RUTA_ESTADISTICA_EVIDENCIAS/02-arranque.txt"
      - name: Ejecutar regresiones del despliegue con las imágenes del build
        run: |
          export RUTA_QA_IMAGEN_APLICACION="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q aplicacion)")"
          export RUTA_QA_IMAGEN_MOTOR="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q motor)")"
          python3 guiones/ci/probar_junit.py pruebas/contenedores salidas/qa/reportes/compose.xml
      - name: Registrar el estado y la red
        run: |
          docker ps --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | tee "$RUTA_ESTADISTICA_EVIDENCIAS/03-docker-ps.txt"
          bash guiones/ci/comprobar_compose.sh red | tee "$RUTA_ESTADISTICA_EVIDENCIAS/04-red.txt"
      - name: Verificar el aislamiento de los contenedores
        run: bash guiones/ci/comprobar_compose.sh aislamiento
      - name: Verificar runtime web sin TLS ni instaladores
        run: docker compose exec -T aplicacion python verificar_runtime.py
      - name: Comprobar el acceso web desde el host
        run: bash guiones/ci/comprobar_compose.sh acceso
      - name: Comprobar la autenticación interna del motor
        run: bash guiones/ci/comprobar_compose.sh autenticacion
      - name: Ejecutar el cálculo desde la aplicación
        run: bash guiones/ci/comprobar_compose.sh calcular | tee "$RUTA_ESTADISTICA_EVIDENCIAS/05-calculo.txt"
      - name: Probar caída y recuperación del motor
        run: bash guiones/ci/comprobar_compose.sh recuperar 2>&1 | tee "$RUTA_ESTADISTICA_EVIDENCIAS/06-recuperacion.txt"
      - name: Registrar la procedencia de la ejecución
        run: python3 guiones/ci/ejecutar.py procedencia > "$RUTA_ESTADISTICA_EVIDENCIAS/00-entorno.json"
      - name: Escanear las imágenes construidas
        run: bash guiones/escanear_imagenes.sh "$RUTA_ESTADISTICA_EVIDENCIAS"
      - name: Verificar que el secreto se inyecta solo en ejecución
        run: |
          for servicio in aplicacion motor; do
            imagen="$(jq -er --arg servicio "$servicio" '.imagenes[$servicio]' "$RUTA_ESTADISTICA_EVIDENCIAS/00-entorno.json")"
            docker run --rm --entrypoint /bin/sh "$imagen" -ec 'test ! -e /run/secrets/motor'
          done
          registro="$RUNNER_TEMP/ruta-estadistica-servicios.log"
          docker compose logs --no-color > "$registro" 2>&1
          coincidencia=0
          grep -rFq -f "$RUTA_ESTADISTICA_ARCHIVO_SECRETO" "$RUTA_ESTADISTICA_EVIDENCIAS" "$registro" || coincidencia=$?
          if [ "$coincidencia" -eq 0 ]; then
            echo "::error::Se detectó la credencial en los registros"
            exit 1
          fi
          test "$coincidencia" -eq 1
      - name: Publicar evidencias del cálculo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-linux-${{ github.sha }}
          path: ${{ env.RUTA_ESTADISTICA_EVIDENCIAS }}
          if-no-files-found: error
          overwrite: true
      - name: Exigir imágenes sin coincidencias altas ni críticas
        run: |
          jq -e -s --slurpfile entorno "$RUTA_ESTADISTICA_EVIDENCIAS/00-entorno.json" '
            length == 2 and .[0].imagen == $entorno[0].imagenes.aplicacion and
            .[1].imagen == $entorno[0].imagenes.motor and
            all(.[]; .altas == 0 and .criticas == 0)
          ' \
            "$RUTA_ESTADISTICA_EVIDENCIAS"/seguridad-{aplicacion,motor}.json
      - name: Resumir la entrega Docker
        run: |
          {
            echo '### Demostración Docker'
            echo
            echo '- Imágenes construidas y dos servicios saludables.'
            echo '- Red interna, motor autenticado y controles de aislamiento verificados.'
            echo '- Análisis real en R antes y después de recrear el motor.'
            printf '\nArtefacto: `docker-linux-%s`\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mostrar el estado de Compose ante un fallo
        if: failure() && env.RUTA_ESTADISTICA_ARCHIVO_SECRETO != ''
        run: docker compose ps --all
      - name: Apagar servicios y retirar el secreto
        if: always()
        run: |
          if [ -n "$RUTA_ESTADISTICA_ARCHIVO_SECRETO" ]; then
            test "$COMPOSE_PROJECT_NAME" = "ruta-actions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            trap 'rm -f -- "$RUTA_ESTADISTICA_ARCHIVO_SECRETO"; rmdir -- "${RUTA_ESTADISTICA_ARCHIVO_SECRETO%/*}"' EXIT
            docker compose down --remove-orphans --rmi local
          fi
