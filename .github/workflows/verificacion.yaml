name: Verificación Windows
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: windows-2025
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.403'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.5.2'
      - name: Restaurar versiones bloqueadas
        shell: pwsh
        run: dotnet restore RutaEstadistica.sln --locked-mode
      - name: Verificar fuentes y digests del contenedor
        shell: pwsh
        run: ./guiones/verificar_fuentes_contenedor.ps1
      - name: Preparar motor nativo
        shell: pwsh
        run: ./guiones/preparar_desarrollo.ps1 -RutaR $env:R_HOME -AdquirirJson
      - name: Verificar cifras, integración, documentación y nombres
        shell: pwsh
        run: ./guiones/ejecutar_pruebas.ps1 -RutaR $env:R_HOME
      - name: Compilar escritorio
        shell: pwsh
        run: ./guiones/compilar.ps1
      - name: Compilar API de trabajos
        shell: pwsh
        run: dotnet build codigo/RutaEstadistica.ServidorLocal -c Release --no-restore
      - name: Verificar API y adaptador con R real en Windows
        shell: pwsh
        run: python guiones/probar_api.py
      - name: Compilar host MCP
        shell: pwsh
        run: dotnet build codigo/RutaEstadistica.ServidorMcp -c Release --no-restore
