name: ruta-estadistica
services:
  motor:
    platform: linux/amd64
    image: ruta-estadistica-motor:0.1.0
    build:
      context: ..
      dockerfile: contenedores/Dockerfile
    labels:
      es.rutaestadistica.propietario: ruta-estadistica
    ports:
      - "127.0.0.1:8787:8787"
    secrets:
      - motor
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 1g
    pids_limit: 64
    restart: "no"
secrets:
  motor:
    file: ${RUTA_ESTADISTICA_ARCHIVO_SECRETO:?Configure el archivo de secreto}
