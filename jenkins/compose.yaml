name: ruta-estadistica-jenkins
services:
  controlador:
    build: .
    platform: linux/amd64
    ports:
      - "127.0.0.1:9090:8080"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx512m"
    volumes:
      - jenkins_home:/var/jenkins_home
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  jenkins_home:
